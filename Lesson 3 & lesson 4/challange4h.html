<!doctype html>
<html>
  <head>
    <title>Input app</title>
  </head>
  <body>
    <div class="js-container"></div>

    <!-- load the code for react for websites-->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!--  loading babel libaray to conver JSX to JS-->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      
      function Display(){
        

        
        const [count,setCount] = React.useState(0);
        const buttonRef = React.useRef();
        function startInterval(){
            
            setInterval(()=>{
                const buttonElem = buttonRef.current;
                if(buttonElem){
                   buttonElem.click();
                }
                
            },1000)
        }
        
        function counter(){
            setCount(count+1);
        }
        function reset(){
            setCount(0);
        }
        return(
            <>
            
           
           
            <button onClick ={counter} ref={buttonRef}> click {count} times</button>
            <button onClick = {reset}>reset</button>
            <button onClick ={startInterval}> auto click</button>

            </>
        );
      }

      

      function App() {
        
        return (
            <>
                <Display />
            </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
