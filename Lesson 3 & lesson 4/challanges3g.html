<!doctype html>
<html>
  <head>
    <title>Input app</title>
  </head>
  <body>
    <div class="js-container"></div>

    <!-- load the code for react for websites-->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!--  loading babel libaray to conver JSX to JS-->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      
      function Display(){
        const [input,setInput] = React.useState('');

        function changeFunc(event){
            setInput(event.target.value);
        }
        return(
            <>
            <p> {input}</p>
            <input placeholder = 'type as you go' onChange = {changeFunc} value ={input}></input>
            <button onClick ={()=>setInput('')} > Reset </button>
            <button onClick ={()=>setInput('hello')} > Example </button>

            </>
        );
      }

      

      function App() {
        
        return (
            <>
                <Display />
            </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
