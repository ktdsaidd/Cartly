<!doctype html>
<html>
  <head>
    <title>ChatBot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <!-- load the code for react for websites-->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!--  loading babel libaray to conver JSX to JS-->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatMessage({message,sender}) {
        return (
            <div>
                { sender === 'robot' && <img src = "robot.png" width = "50"/> }
                {message}
                { sender === 'user' && <img src = "user.png" width = "50"/> }
            </div>
        );
      }
      function ChatInput() {
        return (
          <>
            <input placeholder="Send a message to ChatBot" size="30" />
            <button> Send </button>
          </>
        );
      }

      function App() {
        return (
          <>
            <ChatInput />
            <ChatMessage message = "hello" sender ="user"/>
            <ChatMessage message = "How may I help you!" sender ="robot"/>
            <ChatMessage message = "can ypu give me a joke" sender ="user"/>
            <ChatMessage message = "you think you gonna do it one day?" sender ="robot"/>
          </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
