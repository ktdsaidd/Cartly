<!doctype html>
<html>
  <head>
    <title>lesson4</title>
    <style>
        .custom-button{
            background-color: rgb(0, 123, 255);
            padding: 10px 15px;
            margin-top: 10px;
            color: white;
            border-radius: 10px;
            margin-right: 10px;
        }
        .input-box{
            padding: 10px 15px;
            
            margin-bottom: 10px;
            border-radius: 10px;
        }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <!-- load the code for react for websites-->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!--  loading babel libaray to conver JSX to JS-->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
    
      function Button({name}){
        return(
            <>
         <button className = 'custom-button'> {name}</button>
         </>    
        );
      }
      function HideShow({show,setShow}){
        
        function Switch(){
            setShow(!show);
           
        }
        return(
            <>
            <button onClick = {Switch}> {show? 'hide':'show'}</button>
            </>
        );
      }
       
      function LoginForm(){
        const [show, setShow] = React.useState(false);
       
        return (
          <>
           <p>Hello! Welcome to my website.</p>
           <div> <input placeholder = "Email" className = 'input-box'/> </div>
           <div> <input placeholder = "Password" className = 'input-box'  type={show ? 'text' : 'password'}/> <HideShow show = {show} setShow ={setShow} /></div>
            <Button name = "Login" />
            <Button name = "Sign up" />
          </>
        );
      }
      function App() {
        return (
          <>
           <LoginForm />
          </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
