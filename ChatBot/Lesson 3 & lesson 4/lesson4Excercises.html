<!doctype html>
<html>
  <head>
    <title>Lesson - 4 - Excercises</title>
    <style>
        .button-on-class{
            background-color: rgb(25,135,84 );
        }
        .button-off-class{
            background-color: rgba(228, 18, 35, 0.776);
        }
    </style>
   
  </head>
  <body>
    <div class="js-container"></div>

    <!-- load the code for react for websites-->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <!--  loading babel libaray to conver JSX to JS-->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function Switch(){

        const [On, setOn ] = React.useState(false);
        function changeState(){
            const state = On;
            setOn(!On);
        }
        
        return (
            <>
            {On? <button className = 'button-on-class' onClick ={changeState}> ON  </button> : <button className = 'button-off-class' onClick ={changeState}>  OFF </button>}
            </>
        )
      }
            
      function App() {
        
        return (
         <>
         <Switch />
         </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
